# Reglas de validación configurables para datasets clínicos
age:
  type: numeric
  min: 0
  max: 120

bmi:
  type: numeric
  min: 10
  max: 80

sex:
  type: categorical
  allowed:
    - F
    - M

smoker:
  type: categorical
  allowed:
    - Yes
    - No

systolic_bp:
  type: numeric
  min: 50
  max: 300
